# The public page is our own (page/, scripts/deploy-page.sh, BRDSPRINT-468/470).
# Setup CI and Static Site CI are DISABLED: both would publish the stock Upptime site over it.
# After changing sites here, run: gh workflow run uptime.yml && gh workflow run response-time.yml
status-website:
  cname: status.boarda.io
  name: Boarda
  logoUrl: https://cdn.jsdelivr.net/gh/boarda/boarda-status@v1.0.1/assets/icon.svg
  favicon: https://cdn.jsdelivr.net/gh/boarda/boarda-status@v1.0.1/assets/favicon.ico
  theme: light
  themeUrl: https://cdn.jsdelivr.net/gh/boarda/boarda-status@v1.0.1/assets/boarda-theme.css
  navbar:
    - title: Status
      href: /
    - title: boarda.io
      href: https://boarda.io
  customHeadHtml: '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">'
  scripts:
    - src: https://cdn.jsdelivr.net/gh/boarda/boarda-status@v1.0.1/assets/theme-toggle.js

i18n:
  footer: "© Boarda. All rights reserved. Powered by [Upptime](https://upptime.js.org)."

